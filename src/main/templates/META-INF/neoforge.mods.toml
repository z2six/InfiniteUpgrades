# MainFile: src/main/templates/META-INF/neoforge.mods.toml
# This is an example mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.

# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader = "javafml" #mandatory

# A version range to match for said mod loader.
loaderVersion = "${loader_version_range}" #mandatory

# The license for your mod.
license = "${mod_license}"

# A list of mods - count is determined by the mod loader
[[mods]] #mandatory
# Your mod id
modId = "${mod_id}" #mandatory
# Your mod version
version = "${mod_version}" #mandatory
# Display name in Mods UI
displayName = "${mod_name}" #mandatory
# Authors shown in Mods UI
authors = "${mod_authors}" #optional

# Multi-line description shown in Mods UI
description = '''${mod_description}'''

# Mixins configuration (optional, but you already ship one)
[[mixins]]
config = "${mod_id}.mixins.json"

# --- Dependencies ---

# Require NeoForge itself (expanded by template properties)
[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

# Require the correct Minecraft version range (expanded by template properties)
[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Require GeckoLib (you are using GeckoLib 4.7.x on MC 1.21.1)
[[dependencies."${mod_id}"]]
modId = "geckolib"
type = "required"
# Any 4.7.x or newer is acceptable; adjust if you want to pin tighter.
versionRange = "[4.7.0,)"
ordering = "NONE"
side = "BOTH"

# --- Optional extra features section example (disabled) ---
#[features."${mod_id}"]
#openGLVersion = "[3.2,)"
